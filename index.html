  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

בע שמוביל מסלול זה).<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px;\"><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#00c978;flex:0 0 auto;\"><\/span>מרכזים פתוחים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">מתקני משחק וספורט (מיידי-ארעי)<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">3.1 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>12–18 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">מימון לבדיקה מול רשות ההסדרה.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#ff7ad1;flex:0 0 auto;\"><\/span>שימור ותיירות<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">טיילות – שבילים מקומיים ליישובים מוסדרים<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">3 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>כ-12 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">כולל שביל אופניים חורה–מיתר.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#ba00d6;flex:0 0 auto;\"><\/span>קידום עסקים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">חקלאות וורטיקלית באזורי תעשייה<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">0.35 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>כ-12 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">שיווק מגרשים בתוך כשנה.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#ff7ad1;flex:0 0 auto;\"><\/span>שימור ותיירות<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">דרך נופית תל ערד–תל באר שבע<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">27 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>כ-12 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">דרך נופית לרכבים בין התלים.<\/p><\/div><\/div>\n<\/section>\n<section style=\"margin-top:40px;\">\n<div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#b02a2a;flex:0 0 auto;align-self:center;\"><\/span><h2 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:900;font-size:24px;color:#743626;\">טווח ארוך: פרויקטי דגל<\/h2><span style=\"font-size:13px;color:#6f5a50;\">רב-שנתי · דורש החלטת ממשלה ומימון גדול<\/span><\/div>\n<p style=\"margin:8px 0 0;font-size:14px;color:#6f5a50;\">מנועי הצמיחה הגדולים של התוכנית, יעד לטווח בינוני-ארוך, שנחל באר שבע הוא צעד ראשון מוכח לעברם.<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px;\"><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#919191;flex:0 0 auto;\"><\/span>תשתיות בסיס<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">פסולת – טיפול אזורי כולל<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">436 מלש״ח (שלב א׳)<\/span><span style=\"color:#8a7a70;\">•<\/span><span>עד 5 שנים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">פרויקט הדגל הגדול; מתוקצב בשלביות (15 / 97 / 436 מלש״ח).<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#ff9900;flex:0 0 auto;\"><\/span>דרכים וחיבורים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">דרכים – סעווה–אבו-תלול<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">140 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>36 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">חיבור כביש 25 ל-31; מימון: משרד התחבורה.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#a1c454;flex:0 0 auto;\"><\/span>שטחים גדולים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">שיקום אגן נחל באר שבע (מלא)<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">86 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>כ-60 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">נחל באר שבע הוא שלב התכנון הראשון בדרך לכאן.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#f3a3ff;flex:0 0 auto;\"><\/span>מרכזים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">מרכז מסחרי אזורי<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">51 מלש״ח<\/span><span style=\"color:#8a7a70;\">•<\/span><span>48 חודשים<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">מתחם מרכזים אזוריים: חינוך, תרבות, מסחר וציבורי.<\/p><\/div><div style=\"border:1px solid #e0d5c4;border-radius:8px;background:#fffdf8;padding:15px 16px;display:flex;flex-direction:column;gap:9px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:Rubik,sans-serif;font-size:12px;font-weight:700;color:#4a352c;background:#f6f0e6;border-radius:999px;padding:3px 10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#00c978;flex:0 0 auto;\"><\/span>מרכזים פתוחים<\/span><h3 style=\"margin:0;font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;line-height:1.3;\">פארק אזורי – מעלה נחל באר שבע<\/h3><div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4a352c;\"><span style=\"font-weight:700;\">45 מלש״ח (שלב א׳)<\/span><span style=\"color:#8a7a70;\">•<\/span><span>רב-שנתי<\/span><\/div><p style=\"margin:0;font-size:12.5px;line-height:1.6;color:#6f5a50;\">פארק כלל-אזורי ושמירת שטחים פתוחים.<\/p><\/div><\/div>\n<\/section>\n<section style=\"margin-top:44px;border:2px solid #743626;border-radius:10px;background:#fbf6ee;padding:22px 22px 20px;\">\n<span style=\"display:inline-block;font-family:Rubik,sans-serif;font-weight:800;font-size:12px;letter-spacing:0.08em;color:#fffdf8;background:#087a1e;border-radius:999px;padding:4px 12px;margin-bottom:10px;\">זכייה בפועל · פרויקט מוביל<\/span>\n<h2 style=\"margin:0 0 8px;font-family:Rubik,sans-serif;font-weight:900;font-size:24px;color:#743626;\">קול קורא נחל באר שבע: תכנון מפורט<\/h2>\n<p style=\"margin:0 0 14px;max-width:74ch;font-size:15px;line-height:1.7;color:#4a352c;\">הפריט המוביל בדירוג, לא הזול או המהיר ביותר, אך היחיד שכבר עבר זכייה בפועל, ולכן משמש תקדים מוכח: פרויקט מתוך תוכנית האב שעבר מתכנון למימון. זהו שלב התכנון המפורט הראשון בדרך אל ״שיקום אגן נחל באר שבע״ המלא (86 מלש״ח).<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;\">\n<div style=\"background:#fffdf8;border:1px solid #e0d5c4;border-radius:8px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8a7a70;margin-bottom:4px;\">עלות (מומן)<\/div><div style=\"font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;\">כ-1.07 מלש״ח<\/div><\/div>\n<div style=\"background:#fffdf8;border:1px solid #e0d5c4;border-radius:8px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8a7a70;margin-bottom:4px;\">לו״ז<\/div><div style=\"font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;\">18 חודשים לתכנון<\/div><\/div>\n<div style=\"background:#fffdf8;border:1px solid #e0d5c4;border-radius:8px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8a7a70;margin-bottom:4px;\">היקף<\/div><div style=\"font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;\">כ-2,980 דונם<\/div><\/div>\n<div style=\"background:#fffdf8;border:1px solid #e0d5c4;border-radius:8px;padding:12px 14px;\"><div style=\"font-size:12px;color:#8a7a70;margin-bottom:4px;\">תמיכה<\/div><div style=\"font-family:Rubik,sans-serif;font-weight:800;font-size:16px;color:#743626;\">13 גופים חתומים<\/div><\/div>\n<\/div>\n<p style=\"margin:12px 0 0;font-size:12.5px;color:#6f5a50;\">מקור המימון: הקרן לשמירה על שטחים פתוחים (רמ״י) + רשות ניקוז שקמה-בשור.<\/p>\n<p style=\"margin:14px 0 0;padding-top:14px;border-top:1px solid #e6dccb;font-size:14.5px;line-height:1.7;color:#4a352c;\"><strong style=\"color:#743626;\">המלצה:<\/strong> להריץ 3–4 פרויקטים מהמסלול ה“מהיר” במקביל לנחל באר שבע, כדי לבנות רצף הצלחות מול משרדי הממשלה והקרנות.<\/p>\n<\/section>\n<\/main>\n  <\/sc-if>\n\n  <!-- ============ מסך 6 - כל הפרויקטים ============ -->\n  <sc-if value=\"{{ s6 }}\">\n  <main id=\"maincontent\" tabindex=\"-1\" style=\"max-width: 1400px; margin: 0 auto; padding: 48px 24px 96px;\">\n    <p style=\"margin:0 0 12px; font-family:Rubik,sans-serif; font-weight:700; font-size:13px; letter-spacing:0.12em; color:#ba00d6;\">כלי אינטראקטיבי<\/p>\n    <h1 style=\"margin:0 0 18px; font-family:Rubik,sans-serif; font-weight:900; font-size:40px; color:#743626;\">כלי רישות פרויקטים<\/h1>\n    <div style=\"margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid #e0d5c4;\">\n      <sc-for list=\"{{ netFiltersTop }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; align-items:center; gap:6px; flex-wrap:nowrap; overflow-x:auto; margin-bottom:8px;\">\n              <span style=\"font-family:Rubik,sans-serif; font-weight:700; font-size:12px; color:#6f5a50; flex:0 0 auto;\">{{ g.label }}:<\/span>\n              <sc-for list=\"{{ g.opts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <button type=\"button\" sc-camel-on-click=\"{{ o.go }}\" style=\"flex:0 0 auto; font-family:Assistant,sans-serif; font-size:12.5px; font-weight:600; padding:4px 10px; cursor:pointer; color:{{ o.fg }}; background:{{ o.bg }}; border:1px solid {{ o.border }}; border-radius:999px; white-space:nowrap;\">{{ o.label }}<\/button>\n              <\/sc-for>\n            <\/div>\n      <\/sc-for>\n      <div style=\"display:flex; gap:24px; flex-wrap:wrap; margin-top:2px;\">\n        <sc-for list=\"{{ netFiltersBot }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex; align-items:center; gap:6px; flex-wrap:wrap;\">\n            <span style=\"font-family:Rubik,sans-serif; font-weight:700; font-size:12px; color:#6f5a50;\">{{ g.label }}:<\/span>\n            <sc-for list=\"{{ g.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.go }}\" style=\"font-family:Assistant,sans-serif; font-size:12.5px; font-weight:600; padding:4px 10px; cursor:pointer; color:{{ o.fg }}; background:{{ o.bg }}; border:1px solid {{ o.border }}; border-radius:999px; white-space:nowrap;\">{{ o.label }}<\/button>\n            <\/sc-for>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ connectToggle }}\" style=\"font-family:Assistant,sans-serif; font-size:13px; font-weight:700; padding:6px 14px; cursor:pointer; color:{{ connectFg }}; background:{{ connectBg }}; border:1px solid #ba00d6; border-radius:999px;\">{{ connectBtnLabel }}<\/button>\n        <button type=\"button\" sc-camel-on-click=\"{{ clearUser }}\" style=\"font-family:Assistant,sans-serif; font-size:13px; font-weight:600; padding:6px 12px; cursor:pointer; color:#743626; background:#fffdf8; border:1px solid #e0d5c4; border-radius:999px;\">נקה חיבורים שלי<\/button>\n        <button type=\"button\" sc-camel-on-click=\"{{ clearFilters }}\" style=\"font-family:Assistant,sans-serif; font-size:13px; font-weight:600; padding:6px 12px; cursor:pointer; color:#743626; background:#fffdf8; border:1px solid #e0d5c4; border-radius:999px;\">נקה בחירות<\/button>\n        <button type=\"button\" sc-camel-on-click=\"{{ showPlan }}\" style=\"font-family:Assistant,sans-serif; font-size:13px; font-weight:700; padding:6px 14px; cursor:pointer; color:#fffdf8; background:#743626; border:1px solid #743626; border-radius:999px;\">חיבורי התוכנית<\/button>\n        <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#6f5a50;\"><span style=\"display:inline-block; width:22px; height:0; border-top:3px solid #743626;\"><\/span>מהתוכנית<\/span>\n        <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#6f5a50;\"><span style=\"display:inline-block; width:22px; height:0; border-top:3px dashed #ba00d6;\"><\/span>שהוספו<\/span>\n        <span style=\"font-size:12.5px; font-weight:700; color:#ba00d6;\">{{ connectHint }}<\/span>\n      <\/div>\n    <div style=\"display:flex; gap:24px; align-items:stretch; flex-wrap:wrap;\">\n      <div style=\"flex:3 1 0; min-width:0; align-self:flex-start;\">\n\n        <div style=\"position:relative; background:#fffdf8; border:1px solid #e0d5c4; border-radius:4px; overflow:hidden;\">\n          <svg role=\"img\" aria-label=\"מטריצת רשת הפרויקטים לפי שלבים\" sc-camel-view-box=\"{{ vbox }}\" style=\"width:100%; height:auto; display:block;\">\n            <sc-for list=\"{{ gstages }}\" as=\"st\" hint-placeholder-count=\"5\">\n              <text sc-camel-x=\"{{ st.x }}\" y=\"20\" text-anchor=\"middle\" style=\"font-family:Rubik,sans-serif; font-weight:700; font-size:20px; fill:#743626;\">{{ st.label }}<\/text>\n            <\/sc-for>\n            <sc-for list=\"{{ gedges }}\" as=\"e\" hint-placeholder-count=\"23\">\n              <line sc-camel-x1=\"{{ e.x1 }}\" sc-camel-y1=\"{{ e.y1 }}\" sc-camel-x2=\"{{ e.x2 }}\" sc-camel-y2=\"{{ e.y2 }}\" stroke=\"#743626\" sc-camel-stroke-width=\"{{ e.w }}\" sc-camel-stroke-opacity=\"{{ e.op }}\"><\/line>\n            <\/sc-for>\n            <sc-for list=\"{{ guser }}\" as=\"u\" hint-placeholder-count=\"0\">\n              <line sc-camel-x1=\"{{ u.x1 }}\" sc-camel-y1=\"{{ u.y1 }}\" sc-camel-x2=\"{{ u.x2 }}\" sc-camel-y2=\"{{ u.y2 }}\" stroke=\"#ba00d6\" stroke-width=\"2.4\" stroke-dasharray=\"7 5\" stroke-opacity=\"0.9\"><\/line>\n            <\/sc-for>\n            <sc-for list=\"{{ gnodes }}\" as=\"nd\" hint-placeholder-count=\"37\">\n              <circle sc-camel-cx=\"{{ nd.cx }}\" sc-camel-cy=\"{{ nd.cy }}\" sc-camel-r=\"{{ nd.r }}\" sc-camel-fill=\"{{ nd.fill }}\" sc-camel-fill-opacity=\"{{ nd.op }}\" sc-camel-stroke=\"{{ nd.stroke }}\" sc-camel-stroke-width=\"{{ nd.sw }}\" style=\"cursor:pointer;\" tabindex=\"0\" role=\"button\" sc-camel-ariaLabel=\"{{ nd.label }}\" sc-camel-on-click=\"{{ nd.go }}\"><\/circle>\n            <\/sc-for>\n          <\/svg>\n          <div style=\"position:absolute; inset:0; pointer-events:none;\">\n            <sc-for list=\"{{ gnodes }}\" as=\"nd\" hint-placeholder-count=\"37\">\n              <div style=\"position:absolute; left:{{ nd.lxp }}%; top:{{ nd.typ }}%; transform:translate(-50%,0); width:94px; text-align:center; font-family:Assistant,sans-serif; font-size:10px; font-weight:700; line-height:1.12; color:#3d2b23; opacity:{{ nd.lop }}; text-shadow:0 0 3px #fffdf8, 0 0 3px #fffdf8, 0 0 4px #fffdf8;\">{{ nd.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n\n        <sc-if value=\"{{ netDetail }}\">\n          <div style=\"margin-top:14px; background:#d0efff; border:1px solid #a9d4ea; padding:16px;\">\n            <div style=\"display:flex; justify-content:space-between; gap:10px; align-items:baseline;\">\n              <h3 style=\"margin:0; font-family:Rubik,sans-serif; font-weight:900; font-size:18px; color:#743626;\">{{ netDetail.name }}<\/h3>\n              <button type=\"button\" sc-camel-on-click=\"{{ netDetail.close }}\" aria-label=\"סגירה\" style=\"background:none; border:0; cursor:pointer; font-size:20px; line-height:1; color:#4a6a7a;\">×<\/button>\n            <\/div>\n            <div style=\"margin-top:8px; font-size:13.5px; color:#1d3a4a; display:grid; gap:5px;\">\n              <div>סל: {{ netDetail.basket }} · שלב: {{ netDetail.stage }}<\/div>\n              <div>עלות: {{ netDetail.cost }} · מוכנות: {{ netDetail.status }} · מימון: {{ netDetail.fund }}<\/div>\n              <div>שותפים: {{ netDetail.partners }}<\/div>\n              <div>מחובר ל: {{ netDetail.conns }}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-if>\n\n      <\/div>\n      <aside style=\"flex:1 1 240px; min-width:220px; max-width:340px; display:flex; flex-direction:column;\">\n        <div style=\"flex:1 1 auto; display:flex; flex-direction:column;\">\n        <div style=\"background:#faf7f0; border:1px solid #e0d5c4; padding:16px; font-size:14px; line-height:1.6; color:#4a352c;\">\n          <p style=\"margin:0 0 8px;\"><strong>רישות<\/strong> הוא יצירת רשת של פרויקטים והקשרים ביניהם. התוכנית היא <strong>רשת צמיחה<\/strong> – פרויקטים שמחזקים זה את זה.<\/p>\n          <p style=\"margin:0; font-size:13px; color:#6f5a50;\">לוחצים על פרויקטים כדי לכלול אותם ברשת. הסינון מסייע למצוא. לחיבור ידני – “מצב חיבור ידני”.<\/p>\n        <\/div>\n        <div style=\"margin-top:14px; background:#d0efff; border:1px solid #a9d4ea; padding:16px; flex:1; display:flex; flex-direction:column; min-height:0;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;\"><h3 style=\"margin:0; font-family:Rubik,sans-serif; font-weight:900; font-size:16px; color:#743626;\">הרשת שנבחרה<\/h3><button type=\"button\" sc-camel-on-click=\"{{ netReset }}\" style=\"font-family:Assistant,sans-serif; font-size:12px; font-weight:600; padding:3px 10px; cursor:pointer; color:#743626; background:#fffdf8; border:1px solid #e0d5c4; border-radius:999px;\">איפוס<\/button><\/div>\n          <sc-if value=\"{{ netSummary.empty }}\"><p style=\"margin:0 0 10px; font-size:12.5px; color:#9a2f86; background:#fff0fb; border:1px solid #e5a9d4; padding:8px 10px;\">לחצ/י על פרויקטים במטריצה כדי לכלול אותם ברשת.<\/p><\/sc-if>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px;\">\n            <div style=\"background:#fffdf8; border:1px solid #a9d4ea; padding:8px 10px;\"><div style=\"font-family:Rubik,sans-serif; font-weight:900; font-size:20px; color:#743626;\">{{ netSummary.count }}<\/div><div style=\"font-size:11.5px; color:#4a6a7a;\">פרויקטים<\/div><\/div>\n            <div style=\"background:#fffdf8; border:1px solid #a9d4ea; padding:8px 10px;\"><div style=\"font-family:Rubik,sans-serif; font-weight:900; font-size:18px; color:#743626;\">{{ netSummary.cost }}<\/div><div style=\"font-size:11.5px; color:#4a6a7a;\">עלות מצרפית<\/div><\/div>\n            <div style=\"background:#fffdf8; border:1px solid #a9d4ea; padding:8px 10px;\"><div style=\"font-family:Rubik,sans-serif; font-weight:900; font-size:20px; c .currentTarget.getBoundingClientRect();\n        const x = e.clientX - rect.left;\n        const pct = Math.max(0, Math.min(100, (x / rect.width) * 100));\n        this.setState({ barHover: { pct } });\n      },\n      barLeave: () => this.setState({ barHover: null }),\n      kpiTotal, kpiBaskets, kpiPlans, kpiArea, progressPct,\n      partners: [\n        \"רשות הטבע והגנים\",\n        \"משרד ירושלים ומורשת\",\n        \"מינהל התכנון\",\n        \"משרד האנרגיה והתשתיות\",\n        \"רשות העתיקות\",\n        \"משרד הבריאות\",\n        \"החברה להגנת הטבע\",\n        \"רשות מקרקעי ישראל\",\n        \"קק״ל - קרן קימת לישראל\",\n        \"משרד החקלאות ופיתוח הכפר\",\n        \"חל״ט\",\n        \"רשות ניקוז ים המלח\",\n        \"אשכול נגב מזרחי\",\n        \"רשות ניקוז ונחלים שקמה בשור\",\n        \"הרשות לפיתוח והתיישבות הבדואים בנגב\",\n        \"משרד הפנים\",\n        \"המשרד להגנת הסביבה\"\n      ].map((n, i) => ({ name: n, slotId: \"partner-\" + String(i+1).padStart(2, \"0\") })),\n      mapViews, mapLayers, mapBg, matrixDots,\n      showNetwork: this.state.mapLayers.network && this.props.showNetworkLines !== false,\n      showProjects: this.state.mapLayers.projects,\n      showGrid: this.state.mapLayers.grid,\n      nav: NAV.map(([label, n]) => ({\n        label, go: () => this.go(n),\n        color: screen === n ? \"#743626\" : \"inherit\",\n        bar: screen === n ? \"#743626\" : \"transparent\"\n      })),\n      rows, filters, columns, never: false,\n      countLabel: f === 0\n        ? \"כל 46 השורות המתומחרות, לפי סדר הסלים. סינון לדוגמה - באבטיפוס הסינון עובד, החיפוש עדיין לא.\"\n        : \"מציג \" + rows.length + \" רכיבים בסל \" + f + \". \" + BN[f - 1] + \".\"\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
